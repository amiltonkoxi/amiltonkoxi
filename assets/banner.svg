<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1B26"/>
      <stop offset="50%" stop-color="#16161E"/>
      <stop offset="100%" stop-color="#0F0F17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#BB9AF7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2B3D" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow1" cx="0.85" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.8" r="0.4">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- circuit traces · right side -->
  <g stroke="#7AA2F7" stroke-width="1.2" fill="none" opacity="0.45">
    <path d="M 950 60 L 1050 60 L 1050 110 L 1130 110"/>
    <path d="M 980 160 L 1080 160 L 1080 210 L 1160 210"/>
    <path d="M 920 250 L 1020 250 L 1020 280 L 1100 280"/>
    <circle cx="1130" cy="110" r="3" fill="#7AA2F7"/>
    <circle cx="1160" cy="210" r="3" fill="#BB9AF7"/>
    <circle cx="1100" cy="280" r="3" fill="#7AA2F7"/>
    <circle cx="950" cy="60" r="3" fill="#BB9AF7"/>
    <circle cx="980" cy="160" r="3" fill="#7AA2F7"/>
    <circle cx="920" cy="250" r="3" fill="#BB9AF7"/>
  </g>

  <!-- circuit traces · left side -->
  <g stroke="#BB9AF7" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M 70 80 L 150 80 L 150 130 L 220 130"/>
    <path d="M 50 200 L 130 200 L 130 240 L 200 240"/>
    <circle cx="220" cy="130" r="3" fill="#BB9AF7"/>
    <circle cx="200" cy="240" r="3" fill="#7AA2F7"/>
    <circle cx="70" cy="80" r="3" fill="#7AA2F7"/>
    <circle cx="50" cy="200" r="3" fill="#BB9AF7"/>
  </g>

  <!-- chip icon · top right -->
  <g transform="translate(1050, 40)" opacity="0.85">
    <rect x="0" y="0" width="60" height="60" rx="4" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="2" fill="none" stroke="#7AA2F7" stroke-width="1" opacity="0.7"/>
    <g stroke="#7AA2F7" stroke-width="1.2" opacity="0.7">
      <line x1="-8" y1="14" x2="0" y2="14"/>
      <line x1="-8" y1="24" x2="0" y2="24"/>
      <line x1="-8" y1="34" x2="0" y2="34"/>
      <line x1="-8" y1="44" x2="0" y2="44"/>
      <line x1="60" y1="14" x2="68" y2="14"/>
      <line x1="60" y1="24" x2="68" y2="24"/>
      <line x1="60" y1="34" x2="68" y2="34"/>
      <line x1="60" y1="44" x2="68" y2="44"/>
      <line x1="14" y1="-8" x2="14" y2="0"/>
      <line x1="24" y1="-8" x2="24" y2="0"/>
      <line x1="34" y1="-8" x2="34" y2="0"/>
      <line x1="44" y1="-8" x2="44" y2="0"/>
      <line x1="14" y1="60" x2="14" y2="68"/>
      <line x1="24" y1="60" x2="24" y2="68"/>
      <line x1="34" y1="60" x2="34" y2="68"/>
      <line x1="44" y1="60" x2="44" y2="68"/>
    </g>
    <text x="30" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#7AA2F7" opacity="0.9">FPGA</text>
  </g>

  <!-- main content -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" filter="url(#softGlow)">
    <text x="80" y="135" font-size="14" fill="#7AA2F7" opacity="0.85" letter-spacing="3">$ whoami</text>
    <text x="80" y="195" font-size="56" font-weight="700" fill="#C0CAF5" letter-spacing="-1">Amilton Koxi</text>
    <text x="80" y="232" font-size="18" fill="url(#accent)" letter-spacing="1">R&amp;D Engineer  ·  Embedded  ·  FPGA  ·  Edge AI</text>
  </g>

  <text x="80" y="270" font-family="'JetBrains Mono', monospace" font-size="13" fill="#565F89" letter-spacing="0.5">
    MSc Computer Science Engineering  ·  University of Debrecen
  </text>

  <!-- bottom accent line -->
  <line x1="80" y1="290" x2="280" y2="290" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="290" cy="290" r="3" fill="#BB9AF7"/>
</svg>
