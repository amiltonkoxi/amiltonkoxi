<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1B26"/>
      <stop offset="100%" stop-color="#16161E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2335"/>
      <stop offset="100%" stop-color="#1A1B26"/>
    </linearGradient>
    <pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#2A2B3D"/>
    </pattern>
  </defs>

  <rect width="1100" height="380" fill="url(#bg)"/>
  <rect width="1100" height="380" fill="url(#dotgrid)"/>

  <!-- header -->
  <text x="40" y="42" font-family="'JetBrains Mono', monospace" font-size="13" fill="#565F89" letter-spacing="2">// TECHNICAL STACK</text>
  <text x="40" y="72" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#C0CAF5">What I build with</text>

  <!-- Row 1 -->
  <g font-family="'JetBrains Mono', monospace">
    <!-- LANGUAGES -->
    <g transform="translate(40, 110)">
      <rect x="0" y="0" width="335" height="110" rx="8" fill="url(#cardGrad)" stroke="#7AA2F7" stroke-width="1.2" opacity="0.95"/>
      <rect x="0" y="0" width="3" height="110" rx="1.5" fill="#7AA2F7"/>
      <text x="20" y="28" font-size="10" fill="#7AA2F7" letter-spacing="2">LANGUAGES</text>
      <text x="20" y="58" font-size="15" fill="#C0CAF5" font-weight="600">C  ·  C++  ·  Python</text>
      <text x="20" y="82" font-size="15" fill="#C0CAF5" font-weight="600">VHDL  ·  TypeScript</text>
      <text x="20" y="100" font-size="10" fill="#565F89">production firmware · ML · web</text>
    </g>

    <!-- FPGA / SoC -->
    <g transform="translate(385, 110)">
      <rect x="0" y="0" width="335" height="110" rx="8" fill="url(#cardGrad)" stroke="#BB9AF7" stroke-width="1.2" opacity="0.95"/>
      <rect x="0" y="0" width="3" height="110" rx="1.5" fill="#BB9AF7"/>
      <text x="20" y="28" font-size="10" fill="#BB9AF7" letter-spacing="2">FPGA / SoC</text>
      <text x="20" y="58" font-size="15" fill="#C0CAF5" font-weight="600">Vivado  ·  Vitis  ·  MicroBlaze</text>
      <text x="20" y="82" font-size="15" fill="#C0CAF5" font-weight="600">AXI  ·  XADC  ·  Nexys 4 DDR</text>
      <text x="20" y="100" font-size="10" fill="#565F89">soft-cores · custom IPs · bring-up</text>
    </g>

    <!-- EMBEDDED -->
    <g transform="translate(730, 110)">
      <rect x="0" y="0" width="330" height="110" rx="8" fill="url(#cardGrad)" stroke="#9ECE6A" stroke-width="1.2" opacity="0.95"/>
      <rect x="0" y="0" width="3" height="110" rx="1.5" fill="#9ECE6A"/>
      <text x="20" y="28" font-size="10" fill="#9ECE6A" letter-spacing="2">EMBEDDED</text>
      <text x="20" y="58" font-size="15" fill="#C0CAF5" font-weight="600">STM32  ·  ESP32  ·  SPI / I2C</text>
      <text x="20" y="82" font-size="15" fill="#C0CAF5" font-weight="600">UART  ·  PDM  ·  RTOS basics</text>
      <text x="20" y="100" font-size="10" fill="#565F89">real-time firmware · sensor fusion</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g font-family="'JetBrains Mono', monospace">
    <!-- WIRELESS / IoT -->
    <g transform="translate(40, 240)">
      <rect x="0" y="0" width="335" height="110" rx="8" fill="url(#cardGrad)" stroke="#7DCFFF" stroke-width="1.2" opacity="0.95"/>
      <rect x="0" y="0" width="3" height="110" rx="1.5" fill="#7DCFFF"/>
      <text x="20" y="28" font-size="10" fill="#7DCFFF" letter-spacing="2">WIRELESS / IoT</text>
      <text x="20" y="58" font-size="15" fill="#C0CAF5" font-weight="600">LoRa  ·  MQTT  ·  Wi-Fi</text>
      <text x="20" y="82" font-size="15" fill="#C0CAF5" font-weight="600">BLE  ·  edge gateways</text>
      <text x="20" y="100" font-size="10" fill="#565F89">long-range telemetry · low-power links</text>
    </g>

    <!-- WEB / CLOUD -->
    <g transform="translate(385, 240)">
      <rect x="0" y="0" width="335" height="110" rx="8" fill="url(#cardGrad)" stroke="#F7768E" stroke-width="1.2" opacity="0.95"/>
      <rect x="0" y="0" width="3" height="110" rx="1.5" fill="#F7768E"/>
      <text x="20" y="28" font-size="10" fill="#F7768E" letter-spacing="2">WEB / CLOUD</text>
      <text x="20" y="58" font-size="15" fill="#C0CAF5" font-weight="600">FastAPI  ·  Next.js</text>
      <text x="20" y="82" font-size="15" fill="#C0CAF5" font-weight="600">REST APIs  ·  Azure</text>
      <text x="20" y="100" font-size="10" fill="#565F89">dashboards · telemetry backends</text>
    </g>

    <!-- TOOLING -->
    <g transform="translate(730, 240)">
      <rect x="0" y="0" width="330" height="110" rx="8" fill="url(#cardGrad)" stroke="#E0AF68" stroke-width="1.2" opacity="0.95"/>
      <rect x="0" y="0" width="3" height="110" rx="1.5" fill="#E0AF68"/>
      <text x="20" y="28" font-size="10" fill="#E0AF68" letter-spacing="2">TOOLING</text>
      <text x="20" y="58" font-size="15" fill="#C0CAF5" font-weight="600">Git  ·  Linux  ·  Docker</text>
      <text x="20" y="82" font-size="15" fill="#C0CAF5" font-weight="600">GitHub Actions  ·  Make</text>
      <text x="20" y="100" font-size="10" fill="#565F89">build pipelines · automation</text>
    </g>
  </g>
</svg>
